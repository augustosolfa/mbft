[project]
name = "mbft-indexador"
version = "0.1.0"
description = "Pipeline batch para geração de chunks semânticos e embeddings densos (BAAI/bge-m3) a partir das fichas enriquecidas do MBFT, gerando JSONL para o Vectorize."
authors = [
    {name = "José Augusto Solfa Campos Oliveira", email = "augusto@solfa.net"}
]
requires-python = ">=3.14"
dependencies = [
    "mbft-core",
    "pyyaml>=6.0.3",
    "sentence-transformers>=3.0.0",
    "torch",
    "tqdm",
]

[project.scripts]
mbft-indexador = "mbft_indexador.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mbft_indexador"]
