[project]
name = "mbft-extrator"
version = "0.1.0"
description = "Extrator estruturado de dados do Manual Brasileiro de Fiscalização de Trânsito (MBFT)"
readme = "README.md"
authors = [
    { name = "José Augusto Solfa Campos Oliveira", email = "augusto@solfa.net" }
]
requires-python = ">=3.14"
dependencies = [
    "torch",
    "torchvision",
    "docling",
    "pypdfium2",
    "mbft-core",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }
mbft-core = { workspace = true }

[project.scripts]
mbft-extrator = "mbft_extrator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
