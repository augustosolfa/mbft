<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do MBFT</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        .hero { text-align: center; padding: 4rem 0; }
        .search-box { max-width: 600px; margin: 0 auto 2rem auto; }
        .result-card { margin-bottom: 1rem; border-left: 4px solid var(--pico-primary); padding-left: 1rem; }
        .nav-cards { display: flex; gap: 1rem; justify-content: center; margin-top: 3rem; flex-wrap: wrap; }
        .nav-cards article { min-width: 250px; flex: 1; max-width: 300px; text-align: center; }
        #loading { display: none; text-align: center; margin: 1rem 0; }
    </style>
</head>
<body>
    <main class="container">
        <section class="hero">
            <h1 style="margin-bottom: 0;">Busca MBFT</h1>
            <p>Manual Brasileiro de Fiscalização de Trânsito</p>
        </section>

        <section class="search-box">
            <form id="search-form" role="search">
                <input type="search" id="busca-input" placeholder="Ex: cinto de segurança, celular, película..." required>
                <input type="submit" value="Buscar" id="btn-buscar">
            </form>
            
            <div id="loading" aria-busy="true">Realizando busca vetorial...</div>
            
            <div id="resultados-container">
                <!-- Resultados injetados via JS -->
            </div>
        </section>

        <section class="nav-cards">
            <article>
                <header>Fichas Completas</header>
                <p>Navegue pela listagem de todas as infrações catalogadas.</p>
                <a href="lista.html" role="button" class="outline">Ver Tabela</a>
            </article>
            <article>
                <header>Oráculo (IA)</header>
                <p>Faça uma pergunta complexa para nossa IA treinada com o MBFT.</p>
                <a href="chat.html" role="button">Abrir Chat</a>
            </article>
        </section>
    </main>

    <script>
        const API_BASE = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" 
            ? "http://127.0.0.1:8000" 
            : "https://api.mbft.exemplo.com"; 

        const form = document.getElementById('search-form');
        const input = document.getElementById('busca-input');
        const btn = document.getElementById('btn-buscar');
        const loading = document.getElementById('loading');
        const container = document.getElementById('resultados-container');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = input.value.trim();
            if(!query) return;

            btn.disabled = true;
            loading.style.display = 'block';
            container.innerHTML = '';

            try {
                const res = await fetch(`${API_BASE}/busca/?q=${encodeURIComponent(query)}`);
                if (!res.ok) throw new Error("Erro na API de Busca");
                
                const data = await res.json();
                
                if (data.resultados.length === 0) {
                    container.innerHTML = '<p><em>Nenhum trecho relevante encontrado.</em></p>';
                } else {
                    data.resultados.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'result-card';
                        
                        let header = `<strong>Código: ${item.codigo}</strong>`;
                        if (item.url) {
                            header = `<a href="${item.url}" target="_blank"><strong>Abrir Ficha ${item.codigo}</strong></a>`;
                        }

                        div.innerHTML = `
                            <p style="margin-bottom: 0.5rem;">${header}</p>
                            <p style="font-size: 0.9em; color: var(--pico-muted-color);">${item.trecho}</p>
                        `;
                        container.appendChild(div);
                    });
                }
            } catch(err) {
                container.innerHTML = `<p style="color: red;">Falha ao realizar busca: ${err.message}</p>`;
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
