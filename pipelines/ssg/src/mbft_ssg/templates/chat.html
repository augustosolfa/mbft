<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente IA - MBFT</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        .chat-container { max-width: 800px; margin: 2rem auto; }
        #resposta-container { display: none; margin-top: 2rem; }
        #loading { display: none; text-align: center; margin: 2rem 0; }
    </style>
</head>
<body>
    <main class="container chat-container">
        <nav>
            <ul>
                <li><strong>Oráculo MBFT (Strict RAG)</strong></li>
            </ul>
            <ul>
                <li><a href="index.html">← Voltar ao Índice</a></li>
            </ul>
        </nav>

        <article>
            <header>Faça sua pergunta sobre Fiscalização de Trânsito</header>
            <form id="chat-form">
                <fieldset>
                    <label>
                        Sua dúvida:
                        <textarea id="pergunta" name="pergunta" rows="3" placeholder="Ex: É infração se o passageiro traseiro não usar cinto de segurança em carro de aplicativo?" required minlength="5" maxlength="500"></textarea>
                    </label>
                </fieldset>
                
                <button type="submit" id="btn-enviar">Consultar Inteligência Artificial</button>
            </form>

            <div id="loading" aria-busy="true">
                O Oráculo está lendo o Manual e redigindo a resposta. Por favor, aguarde...
            </div>

            <div id="resposta-container">
                <h3>Resposta Oficial:</h3>
                <blockquote id="resposta-texto"></blockquote>
            </div>
        </article>
    </main>

    <script src="config.js"></script>
    <script>
        // Em dev local usa a porta 8000 (FastAPI direto, sem prefixo); em produção o Worker
        // único expõe a API sob /api (assets.run_worker_first = ["/api/*"]), com mesma origem
        // quando window.MBFT_CONFIG.apiBaseUrl está vazio.
        const IS_LOCAL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
        const API_BASE = IS_LOCAL
            ? "http://127.0.0.1:8000"
            : ((window.MBFT_CONFIG && window.MBFT_CONFIG.apiBaseUrl) || "").replace(/\/+$/, "");
        const API_PREFIX = IS_LOCAL ? "" : "/api";

        const form = document.getElementById('chat-form');
        const btnEnviar = document.getElementById('btn-enviar');
        const loadingEl = document.getElementById('loading');
        const respostaContainer = document.getElementById('resposta-container');
        const respostaTexto = document.getElementById('resposta-texto');

        const CHAT_ERROR_MESSAGES = Object.freeze({
            401: "A API não autorizou esta consulta. Tente novamente mais tarde.",
            403: "A API não autorizou esta consulta. Tente novamente mais tarde.",
            429: "Limite de consultas atingido. Aguarde alguns instantes antes de tentar novamente.",
            500: "O serviço do Oráculo está temporariamente indisponível. Tente novamente mais tarde.",
            502: "O serviço do Oráculo está temporariamente indisponível. Tente novamente mais tarde.",
            503: "O serviço do Oráculo está temporariamente indisponível. Tente novamente mais tarde.",
            504: "O serviço do Oráculo está temporariamente indisponível. Tente novamente mais tarde."
        });

        function obterMensagemErroHttp(status, retryAfter) {
            if (status === 429 && Number(retryAfter) > 0) {
                const seg = Number(retryAfter);
                let espera;
                if (seg <= 120) {
                    espera = `${Math.ceil(seg)} s`;
                } else if (seg <= 7200) {
                    espera = `${Math.ceil(seg / 60)} min`;
                } else {
                    espera = `${Math.ceil(seg / 3600)} h`;
                }
                return `Limite de consultas atingido. Tente novamente em ${espera}.`;
            }
            if (CHAT_ERROR_MESSAGES[status]) {
                return CHAT_ERROR_MESSAGES[status];
            }
            if (status >= 500) {
                return "O serviço do Oráculo está temporariamente indisponível. Tente novamente mais tarde.";
            }
            return "A API não conseguiu processar a consulta. Verifique a pergunta e tente novamente.";
        }

        async function lerJsonSeguro(response) {
            try {
                return await response.json();
            } catch {
                return null;
            }
        }

        function exibirErro(mensagem) {
            respostaTexto.innerHTML = '';
            const spanErr = document.createElement('span');
            spanErr.style.color = 'red';
            const strongErr = document.createElement('strong');
            strongErr.textContent = 'Erro: ';
            spanErr.appendChild(strongErr);
            spanErr.appendChild(document.createTextNode(mensagem));
            respostaTexto.appendChild(spanErr);
            respostaContainer.style.display = 'block';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const pergunta = document.getElementById('pergunta').value;

            // Prepara UI
            btnEnviar.disabled = true;
            respostaContainer.style.display = 'none';
            loadingEl.style.display = 'block';

            try {
                const chatRes = await fetch(`${API_BASE}${API_PREFIX}/chat/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ pergunta: pergunta })
                });

                const chatData = await lerJsonSeguro(chatRes);
                loadingEl.style.display = 'none';

                if (chatRes.ok && chatData && typeof chatData.resposta === 'string') {
                    respostaTexto.innerText = chatData.resposta;
                    respostaContainer.style.display = 'block';
                } else if (!chatRes.ok) {
                    exibirErro(obterMensagemErroHttp(chatRes.status, chatRes.headers.get('Retry-After')));
                } else {
                    exibirErro("A API retornou uma resposta inválida. Tente novamente mais tarde.");
                }
            } catch (err) {
                loadingEl.style.display = 'none';
                exibirErro("Não foi possível comunicar com a API no momento. Tente novamente mais tarde.");
            } finally {
                btnEnviar.disabled = false;
            }
        });
    </script>
</body>
</html>
