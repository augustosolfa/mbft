[project]
name = "mbft-workspace"
version = "0.1.0"
description = "Monorepo para extração, processamento e aplicações do Manual Brasileiro de Fiscalização de Trânsito (MBFT)"
readme = "README.md"
authors = [
    { name = "José Augusto Solfa Campos Oliveira", email = "augusto@solfa.net" }
]
requires-python = ">=3.14"
dependencies = [
    "mbft-extrator",
    "mbft-core",
    "mbft-enriquecedor",
    "mbft-indexador",
    "mbft-ssg",
    "mbft-api",
]

[tool.uv.sources]
mbft-extrator = { workspace = true }
mbft-core = { workspace = true }
mbft-enriquecedor = { workspace = true }
mbft-indexador = { workspace = true }
mbft-ssg = { workspace = true }
mbft-api = { workspace = true }

[tool.uv.workspace]
members = ["pipelines/*", "apps/*"]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[dependency-groups]
dev = [
    "google-genai>=2.28.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

