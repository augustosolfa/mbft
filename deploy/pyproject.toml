[project]
name = "mbft-deploy"
version = "0.3.0"
description = "Exportadores de dados para Cloudflare (D1 SQL) e automação de provisionamento e deploy (D1, Vectorize e Workers)."
readme = "README.md"
authors = [
    { name = "José Augusto Solfa Campos Oliveira", email = "augusto@solfa.net" }
]
requires-python = ">=3.14"
dependencies = [
    "mbft-core",
    "mbft-api",
    "python-dotenv>=1.2.4",
]

[project.scripts]
mbft-deploy = "mbft_deploy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mbft_deploy"]
