[project]
name = "mbft-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "José Augusto Solfa Campos Oliveira", email = "augusto@solfa.net" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.4",
    "mbft-core",
    "mbft-gerador",
    "mbft-recuperador",
    "pyjwt>=2.15.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
mbft-core = { workspace = true }
mbft-recuperador = { workspace = true }
mbft-gerador = { workspace = true }
