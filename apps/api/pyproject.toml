[project]
name = "mbft-api"
version = "0.1.0"
description = "API Gateway e Motor RAG (Recuperador + Gerador) do MBFT para Cloudflare Workers."
readme = "README.md"
authors = [
    { name = "José Augusto Solfa Campos Oliveira", email = "augusto@solfa.net" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.4",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "cryptography>=50.0.2",
    "google-genai>=2.28.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]
